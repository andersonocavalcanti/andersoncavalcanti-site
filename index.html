<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anderson Cavalcanti | Em construção</title>
<meta name="description" content="Site em construção.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316261E'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='%23F2F5F1' text-anchor='middle'%3EAC%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#F2F5F1;--ink:#16261E;--muted:#56685D;--line:#CBD6CC;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101814;--ink:#E7EEE8;--muted:#9DB0A3;--line:#2E3F35;color-scheme:dark}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;display:grid;place-items:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
main{text-align:center;display:grid;gap:14px;justify-items:center}
.mark{width:56px;height:56px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:1.3rem}
h1{margin:0;font-size:clamp(2rem,7vw,3.2rem);letter-spacing:-.02em;line-height:1.1}
p{margin:0;color:var(--muted)}
.bar{width:120px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:var(--ink);border-radius:4px;animation:go 1.8s ease-in-out infinite}
@keyframes go{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">AC</div>
  <h1>Em construção</h1>
  <p>Anderson Cavalcanti</p>
  <div class="bar" aria-hidden="true"><i></i></div>
</main>
</body>
</html>
